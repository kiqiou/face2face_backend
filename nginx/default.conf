server {
    listen 80;
    server_name f2face.by www.f2face.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name f2face.by www.f2face.by;

    ssl_certificate /etc/letsencrypt/live/f2face.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f2face.by/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
