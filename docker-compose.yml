services:
  web:
    build: ./
    env_file:
      - ./.env
    depends_on:
      - db
    working_dir: /app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
    volumes:
      - .:/app
    command: gunicorn face2face_back.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # порт 8000 наружу больше не публикуем — только внутри docker-сети, через nginx

  bot:
    build: ./
    env_file:
      - ./.env
    depends_on:
      - db
    working_dir: /app
    volumes:
      - .:/app
    command: python manage.py run_bot

  redis:
    image: redis:7

  db:
    image: postgres:15
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_face2face
    env_file:
      - ./.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:6060:80"   # слушает только локально на сервере, не в открытый интернет
    depends_on:
      - db

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/dist:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web

volumes:
  postgres_data: